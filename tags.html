---
layout: default
title: Tags
permalink: /tags/
---

<style>
  .tags-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px 0;
  }

  .page-title {
    font-size: 28px;
    margin-bottom: 24px;
  }

  /* ===== ส่วนแสดง Tags ทั้งหมด ===== */
  .all-tags-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 40px;
  }

  .tag-card {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border: 1px solid #333;
    border-radius: 999px;
    color: #ccc;
    text-decoration: none;
    font-size: 14px;
    transition: all 0.2s ease;
  }

  .tag-card:hover {
    border-color: #666;
    color: #fff;
    background-color: rgba(255, 255, 255, 0.05);
  }

  .tag-count {
    font-size: 11px;
    background: #333;
    color: #aaa;
    padding: 2px 7px;
    border-radius: 10px;
  }

  /* ===== ส่วนรายการบทความ ===== */
  .posts-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .post-item {
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #222;
  }

  .post-item a {
    color: #fff;
    text-decoration: none;
    font-size: 16px;
  }

  .post-item a:hover {
    color: #aaa;
  }

  .post-date {
    color: #777;
    font-size: 13px;
    margin-left: 10px;
  }

  .back-btn {
    display: inline-block;
    margin-bottom: 20px;
    color: #777;
    text-decoration: none;
    font-size: 14px;
  }

  .back-btn:hover {
    color: #ccc;
  }
</style>

<div class="tags-container">

  <!-- โครงสร้างเมื่อเลือก Tag ใด Tag หนึ่ง -->
  <div id="single-tag-view" style="display: none;">
    <a href="{{ '/tags/' | relative_url }}" class="back-btn">← ดู Tags ทั้งหมด</a>
    <h1 class="page-title">Tag: <span id="tag-name" style="color: #4a90e2;"></span></h1>
    <ul id="tag-posts-list" class="posts-list"></ul>
  </div>

  <!-- โครงสร้างหน้ารวม Tags ทั้งหมด -->
  <div id="all-tags-view" style="display: none;">
    <h1 class="page-title">Tags ทั้งหมด</h1>
    <div class="all-tags-grid">
      {% assign sorted_tags = site.tags | sort %}
      {% for tag in sorted_tags %}
        <a class="tag-card" href="{{ '/tags/' | relative_url }}?tag={{ tag[0] | url_encode }}">
          <span>#{{ tag[0] }}</span>
          <span class="tag-count">{{ tag[1].size }}</span>
        </a>
      {% endfor %}
    </div>
  </div>

</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    let tag = params.get('tag');

    const singleView = document.getElementById('single-tag-view');
    const allView = document.getElementById('all-tags-view');

    if (tag) {
      // 1. กรณีผู้ใช้คลิกเลือก Tag (แสดงบทความเฉพาะ Tag นำเสนอ)
      tag = decodeURIComponent(tag);
      document.getElementById('tag-name').textContent = tag;
      singleView.style.display = 'block';

      const posts = [
        {% for post in site.posts %}
          {
            title: {{ post.title | jsonify }},
            url: {{ post.url | relative_url | jsonify }},
            date: {{ post.date | date: "%d/%m/%Y" | jsonify }},
            tags: {{ post.tags | jsonify }}
          }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ];

      const filteredPosts = posts.filter(p => p.tags && p.tags.includes(tag));
      const listContainer = document.getElementById('tag-posts-list');

      if (filteredPosts.length > 0) {
        filteredPosts.forEach(p => {
          const li = document.createElement('li');
          li.className = 'post-item';
          li.innerHTML = `<a href="${p.url}">${p.title}</a> <span class="post-date">${p.date}</span>`;
          listContainer.appendChild(li);
        });
      } else {
        listContainer.innerHTML = '<li style="color:#777;">ไม่พบบทความใน Tag นี้</li>';
      }

    } else {
      // 2. กรณีผู้ใช้เข้าหน้า /tags/ โดยไม่มี Parameter (แสดง Tags ทั้งหมด)
      allView.style.display = 'block';
    }
  });
</script>
