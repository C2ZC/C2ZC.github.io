<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}
  </title>

  <meta name="description" content="{{ site.description | strip_html | escape }}">
  <meta name="author" content="{{ site.title | escape }}">

  <!-- Canonical -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ "/assets/images/avatar.png" | relative_url }}">

  <!-- Theme Color -->
  <meta name="theme-color" content="#ffffff">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ site.description | strip_html | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ "/assets/images/avatar@2x.png" | absolute_url }}">

  <meta name="twitter:card" content="summary">

  <!-- Fonts -->
  <link rel="preload" href="{{ "/assets/fonts/CMU-Light.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ "/assets/fonts/CMU-Regular.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ "/assets/fonts/CMU-Bold.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>

  {% if page.url == "/" %}

  <!-- LittleLink -->
  <link rel="stylesheet" href="{{ "/assets/css/reset.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/css/brands.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/css/brands-extended.css" | relative_url }}">

  {% else %}

  <!-- Jekyll / Minima -->
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/css/blog-custom.css" | relative_url }}">

  {% endif %}

  {%- feed_meta -%}

  {%- seo -%}

  {% if jekyll.environment == "production" and site.google_analytics %}
  {% include google-analytics.html %}
  {% endif %}

</head>
